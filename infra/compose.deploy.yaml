name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 896m
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - pet_internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-pet-curation-backend:local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: stage
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      GUEST_LOOKUP_TOKEN_SECRET: ${GUEST_LOOKUP_TOKEN_SECRET:?GUEST_LOOKUP_TOKEN_SECRET is required}
      MEDIA_STORAGE_ROOT: /srv/media
      MEDIA_PUBLIC_CACHE_MAX_AGE: ${MEDIA_PUBLIC_CACHE_MAX_AGE:-1h}
      SIMULATED_PAYMENT_ENABLED: "true"
    expose:
      - "8080"
    volumes:
      - ../media:/srv/media:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1408m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - pet_internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/api/v1
    image: ${FRONTEND_IMAGE:-pet-curation-frontend:local}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/api/v1
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - pet_internal

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      APP_WWW_DOMAIN: ${APP_WWW_DOMAIN:?APP_WWW_DOMAIN is required}
      LEGACY_APP_DOMAIN: ${LEGACY_APP_DOMAIN:?LEGACY_APP_DOMAIN is required}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|APP_WWW_DOMAIN|LEGACY_APP_DOMAIN)$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -qx ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - pet_internal

  certbot:
    image: certbot/certbot:v4.2.0
    profiles:
      - tools
    entrypoint:
      - certbot
    command:
      - --version
    ports:
      - "80:80"
    volumes:
      - letsencrypt:/etc/letsencrypt
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - pet_internal

volumes:
  postgres_data:
  letsencrypt:

networks:
  pet_internal:
    driver: bridge
