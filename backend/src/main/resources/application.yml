spring:
  application:
    name: pet-curation-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  visitor-cookie:
    secure: ${SESSION_COOKIE_SECURE:false}
    max-age: 30d
  storage:
    root: ${MEDIA_STORAGE_ROOT:media}
    public-cache-max-age: ${MEDIA_PUBLIC_CACHE_MAX_AGE:1h}
    image-upload:
      max-file-size: 8MB
      max-width: 10000
      max-height: 10000
      max-pixels: 40000000
      output-max-edge: 1600
  payment:
    simulated-enabled: false
  order:
    guest-lookup-token-secret: ${GUEST_LOOKUP_TOKEN_SECRET}
